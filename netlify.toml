[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Supabase client config (Plan Day 5/6). Publishable key is safe to commit:
  # it is designed for client bundles and ships embedded in the built app anyway.
  # The service-role key must NEVER appear in this repo.
  VITE_SUPABASE_URL      = "https://drgffhoigdocwbusincp.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_RUjL6HMc-fN4mwAk8QKjLQ_F5NlZTA8"

# SPA fallback — all routes serve index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Never cache the root HTML (no Clear-Site-Data: it was erasing user storage every load)
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Never cache the service worker
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# PWA manifest
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type  = "application/manifest+json"
