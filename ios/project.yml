name: IronQ
options:
  bundleIdPrefix: co.sustany
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  IronQ:
    type: application
    platform: iOS
    sources:
      - IronQ
    entitlements:
      path: IronQ/IronQ.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.sustany.ironq
        PRODUCT_NAME: IronQ
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: "$(APPLE_TEAM_ID)"
        CODE_SIGN_STYLE: Manual
    info:
      path: IronQ/Info.plist
      properties:
        CFBundleDisplayName: IronQ
        NSHealthShareUsageDescription: IronQ reads your heart rate and workout data to show live and historical training metrics.
        NSHealthUpdateUsageDescription: IronQ saves your completed workouts to Apple Health.
        ITSAppUsesNonExemptEncryption: false
schemes:
  IronQ:
    build:
      targets:
        IronQ: all
    run:
      config: Debug
    archive:
      config: Release
